  # ==========================================
  # 2. СБОРКА ДЛЯ WINDOWS (Colku.exe)
  # ==========================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Windows Desktop App
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path desktop_src/com/colku

          # Исходный код Java Swing приложения Colku для ПК
          @'
          package com.colku;

          import javax.swing.*;
          import java.awt.*;

          class MathFunctionParser {
              private final String str;
              private final double xVal;
              private int pos = -1, ch;

              public MathFunctionParser(String str, double xVal) {
                  this.str = str;
                  this.xVal = xVal;
              }

              private void nextChar() { ch = (++pos < str.length()) ? str.charAt(pos) : -1; }

              private boolean eat(int charToEat) {
                  while (ch == ' ') nextChar();
                  if (ch == charToEat) { nextChar(); return true; }
                  return false;
              }

              public double parse() {
                  nextChar();
                  double x = parseExpression();
                  if (pos < str.length()) throw new RuntimeException("Неизвестный символ: " + (char)ch);
                  return x;
              }

              private double parseExpression() {
                  double x = parseTerm();
                  for (;;) {
                      if      (eat('+')) x += parseTerm();
                      else if (eat('-')) x -= parseTerm();
                      else return x;
                  }
              }

              private double parseTerm() {
                  double x = parseFactor();
                  for (;;) {
                      if      (eat('*')) x *= parseFactor();
                      else if (eat('/')) x /= parseFactor();
                      else if (ch == '(' || (ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) { x *= parseFactor(); }
                      else return x;
                  }
              }

              private double parseFactor() {
                  if (eat('+')) return +parseFactor();
                  if (eat('-')) return -parseFactor();
                  double x;
                  int startPos = this.pos;
                  if (eat('(')) {
                      x = parseExpression();
                      eat(')');
                  } else if ((ch >= '0' && ch <= '9') || ch == '.') {
                      while ((ch >= '0' && ch <= '9') || ch == '.') nextChar();
                      x = Double.parseDouble(str.substring(startPos, this.pos));
                  } else if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) {
                      while ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) nextChar();
                      String func = str.substring(startPos, this.pos);
                      if (func.equalsIgnoreCase("x")) {
                          x = xVal;
                      } else {
                          if (eat('(')) { x = parseExpression(); eat(')'); }
                          else { x = parseFactor(); }
                          switch (func.toLowerCase()) {
                              case "sin": x = Math.sin(x); break;
                              case "cos": x = Math.cos(x); break;
                              case "tan": x = Math.tan(x); break;
                              case "sqrt": x = Math.sqrt(x); break;
                              case "abs": x = Math.abs(x); break;
                              case "log": case "ln": x = Math.log(x); break;
                              default: throw new RuntimeException("Неизвестная функция");
                          }
                      }
                  } else {
                      throw new RuntimeException("Ошибка");
                  }
                  if (eat('^')) x = Math.pow(x, parseFactor());
                  return x;
              }
          }

          class GraphPanel extends JPanel {
              private String formula = "(1/4)x^3";
              private double minX = -3, maxX = 3;

              public void setFormulaAndRange(String formula, double minX, double maxX) {
                  this.formula = formula;
                  this.minX = minX;
                  this.maxX = maxX;
                  repaint();
              }

              @Override
              protected void paintComponent(Graphics g) {
                  super.paintComponent(g);
                  Graphics2D g2 = (Graphics2D) g;
                  g2.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);

                  int w = getWidth(), h = getHeight();
                  g2.setColor(Color.WHITE);
                  g2.fillRect(0, 0, w, h);

                  if (maxX <= minX) maxX = minX + 1;
                  double minY = -10, maxY = 10;

                  int zeroX = (int) (w * (-minX) / (maxX - minX));
                  int zeroY = (int) (h * (maxY) / (maxY - minY));

                  g2.setColor(new Color(226, 232, 240));
                  for (int i = 0; i <= 10; i++) {
                      int gx = (int) (w * i / 10.0);
                      g2.drawLine(gx, 0, gx, h);
                      g2.drawLine(0, (int) (h * i / 10.0), w, (int) (h * i / 10.0));
                  }

                  g2.setColor(new Color(51, 65, 85));
                  g2.setStroke(new BasicStroke(2));
                  g2.drawLine(0, zeroY, w, zeroY);
                  g2.drawLine(zeroX, 0, zeroX, h);

                  if (formula == null || formula.trim().isEmpty()) return;

                  g2.setColor(new Color(79, 70, 229));
                  g2.setStroke(new BasicStroke(3));

                  Integer lastPx = null, lastPy = null;

                  for (int px = 0; px < w; px += 2) {
                      double x = minX + (double) px / w * (maxX - minX);
                      try {
                          MathFunctionParser parser = new MathFunctionParser(formula, x);
                          double y = parser.parse();
                          if (Double.isNaN(y) || Double.isInfinite(y)) { lastPx = null; continue; }

                          int py = (int) (h * (maxY - y) / (maxY - minY));
                          if (py < -h || py > 2 * h) { lastPx = null; continue; }

                          if (lastPx != null) {
                              g2.drawLine(lastPx, lastPy, px, py);
                          }
                          lastPx = px;
                          lastPy = py;
                      } catch (Exception e) {
                          lastPx = null;
                      }
                  }
              }
          }

          public class ColkuDesktop extends JFrame {
              private JTextField txtFormula = new JTextField("(1/4)x^3", 15);
              private JTextField txtStartX = new JTextField("-3", 5);
              private JTextField txtEndX = new JTextField("3", 5);
              private JTextField txtStep = new JTextField("0.5", 5);
              private JTextArea txtResult = new JTextArea(10, 30);
              private GraphPanel graphPanel = new GraphPanel();
              private JTextField activeInput = txtFormula;

              public ColkuDesktop() {
                  setTitle("Colku - Графический калькулятор");
                  setDefaultCloseOperation(EXIT_ON_CLOSE);
                  setSize(800, 650);
                  setLocationRelativeTo(null);

                  JPanel mainPanel = new JPanel(new BorderLayout(10, 10));
                  mainPanel.setBorder(BorderFactory.createEmptyBorder(10, 10, 10, 10));

                  JPanel topPanel = new JPanel(new FlowLayout());
                  topPanel.add(new JLabel("f(x):"));
                  topPanel.add(txtFormula);
                  topPanel.add(new JLabel("Старт X:"));
                  topPanel.add(txtStartX);
                  topPanel.add(new JLabel("Конец X:"));
                  topPanel.add(txtEndX);
                  topPanel.add(new JLabel("Шаг:"));
                  topPanel.add(txtStep);

                  JButton btnCalc = new JButton("Рассчитать");
                  btnCalc.setBackground(new Color(79, 70, 229));
                  btnCalc.setForeground(Color.WHITE);
                  btnCalc.addActionListener(e -> calculate());
                  topPanel.add(btnCalc);

                  txtFormula.addFocusListener(new java.awt.event.FocusAdapter() { public void focusGained(java.awt.event.FocusEvent e) { activeInput = txtFormula; } });
                  txtStartX.addFocusListener(new java.awt.event.FocusAdapter() { public void focusGained(java.awt.event.FocusEvent e) { activeInput = txtStartX; } });
                  txtEndX.addFocusListener(new java.awt.event.FocusAdapter() { public void focusGained(java.awt.event.FocusEvent e) { activeInput = txtEndX; } });
                  txtStep.addFocusListener(new java.awt.event.FocusAdapter() { public void focusGained(java.awt.event.FocusEvent e) { activeInput = txtStep; } });

                  JPanel keypadPanel = createKeypad();

                  JPanel leftPanel = new JPanel(new BorderLayout(5, 5));
                  leftPanel.add(topPanel, BorderLayout.NORTH);
                  leftPanel.add(keypadPanel, BorderLayout.CENTER);

                  txtResult.setFont(new Font("Monospaced", Font.PLAIN, 12));
                  JScrollPane scrollResult = new JScrollPane(txtResult);

                  JSplitPane splitPane = new JSplitPane(JSplitPane.VERTICAL_SPLIT, graphPanel, scrollResult);
                  splitPane.setResizeWeight(0.6);

                  mainPanel.add(leftPanel, BorderLayout.NORTH);
                  mainPanel.add(splitPane, BorderLayout.CENTER);

                  add(mainPanel);
              }

              private JPanel createKeypad() {
                  JPanel p = new JPanel(new GridLayout(4, 6, 4, 4));
                  String[] btns = {
                      "x", "^", "a/b", "(", ")", "⌫",
                      "sin", "cos", "√", "/", "*", "C",
                      "7", "8", "9", "-", "4", "5",
                      "6", "+", "1", "2", "3", "0"
                  };

                  for (String b : btns) {
                      JButton btn = new JButton(b);
                      btn.addActionListener(e -> {
                          if (b.equals("a/b")) activeInput.replaceSelection("(/)");
                          else if (b.equals("√")) activeInput.replaceSelection("sqrt(");
                          else if (b.equals("sin") || b.equals("cos")) activeInput.replaceSelection(b + "(");
                          else if (b.equals("⌫")) {
                              String t = activeInput.getText();
                              if (!t.isEmpty()) activeInput.setText(t.substring(0, t.length() - 1));
                          } else if (b.equals("C")) activeInput.setText("");
                          else activeInput.replaceSelection(b);
                      });
                      p.add(btn);
                  }
                  return p;
              }

              private void calculate() {
                  String f = txtFormula.getText().trim();
                  try {
                      double startX = Double.parseDouble(txtStartX.getText().trim());
                      double endX = Double.parseDouble(txtEndX.getText().trim());
                      double step = Double.parseDouble(txtStep.getText().trim());

                      graphPanel.setFormulaAndRange(f, startX, endX);

                      StringBuilder sb = new StringBuilder();
                      for (double x = startX; x <= endX + 1e-9; x += step) {
                          try {
                              MathFunctionParser p = new MathFunctionParser(f, x);
                              sb.append(String.format("x = %6.2f   -->   f(x) = %8.4f\n", x, p.parse()));
                          } catch (Exception ex) {
                              sb.append(String.format("x = %6.2f   -->   Ошибка\n", x));
                          }
                      }
                      txtResult.setText(sb.toString());
                  } catch (Exception ex) {
                      txtResult.setText("Ошибка ввода параметров");
                  }
              }

              public static void main(String[] args) {
                  SwingUtilities.invokeLater(() -> new ColkuDesktop().setVisible(true));
              }
          }
          '@ | Out-File -Encoding utf8 desktop_src/com/colku/ColkuDesktop.java

          # Компиляция и создание JAR
          javac -d desktop_bin desktop_src/com/colku/*.java
          
          # Создание файла манифеста
          "Main-Class: com.colku.ColkuDesktop`n" | Out-File -Encoding ascii Manifest.txt
          jar cfm Colku.jar Manifest.txt -C desktop_bin .

          # Упаковка в автономный EXE с помощью jpackage
          jpackage --type app-image --name Colku --input . --main-jar Colku.jar --main-class com.colku.ColkuDesktop --dest output
          
          # Архивация папки приложения для готового скачивания
          Compress-Archive -Path "output/Colku/*" -DestinationPath "Colku-Windows.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colku-Windows-EXE
          path: Colku-Windows.zip
