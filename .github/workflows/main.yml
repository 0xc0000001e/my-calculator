name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project Structure
        run: |
          # 1. Принимаем лицензии Android SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # 2. Создаем структуру каталогов
          mkdir -p app/src/main/java/com/example/functioncalculator
          mkdir -p app/src/main/res/layout

          # 3. Парсер математических выражений (MathFunctionParser.java)
          cat << 'EOF' > app/src/main/java/com/example/functioncalculator/MathFunctionParser.java
          package com.example.functioncalculator;

          public class MathFunctionParser {
              private final String str;
              private final double xVal;
              private int pos = -1;
              private int ch;

              public MathFunctionParser(String str, double xVal) {
                  this.str = str;
                  this.xVal = xVal;
              }

              private void nextChar() {
                  ch = (++pos < str.length()) ? str.charAt(pos) : -1;
              }

              private boolean eat(int charToEat) {
                  while (ch == ' ') nextChar();
                  if (ch == charToEat) {
                      nextChar();
                      return true;
                  }
                  return false;
              }

              public double parse() {
                  nextChar();
                  double x = parseExpression();
                  if (pos < str.length()) throw new RuntimeException("Неизвестный символ: " + (char)ch);
                  return x;
              }

              private double parseExpression() {
                  double x = parseTerm();
                  for (;;) {
                      if      (eat('+')) x += parseTerm();
                      else if (eat('-')) x -= parseTerm();
                      else return x;
                  }
              }

              private double parseTerm() {
                  double x = parseFactor();
                  for (;;) {
                      if      (eat('*')) x *= parseFactor();
                      else if (eat('/')) x /= parseFactor();
                      else if (ch == '(' || (ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) {
                          x *= parseFactor();
                      }
                      else return x;
                  }
              }

              private double parseFactor() {
                  if (eat('+')) return +parseFactor();
                  if (eat('-')) return -parseFactor();

                  double x;
                  int startPos = this.pos;
                  if (eat('(')) {
                      x = parseExpression();
                      eat(')');
                  } else if ((ch >= '0' && ch <= '9') || ch == '.') {
                      while ((ch >= '0' && ch <= '9') || ch == '.') nextChar();
                      x = Double.parseDouble(str.substring(startPos, this.pos));
                  } else if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) {
                      while ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) nextChar();
                      String func = str.substring(startPos, this.pos);
                      if (func.equalsIgnoreCase("x")) {
                          x = xVal;
                      } else {
                          if (eat('(')) {
                              x = parseExpression();
                              eat(')');
                          } else {
                              x = parseFactor();
                          }
                          switch (func.toLowerCase()) {
                              case "sin": x = Math.sin(x); break;
                              case "cos": x = Math.cos(x); break;
                              case "tan": x = Math.tan(x); break;
                              case "sqrt": x = Math.sqrt(x); break;
                              case "abs": x = Math.abs(x); break;
                              case "log": case "ln": x = Math.log(x); break;
                              default: throw new RuntimeException("Неизвестная функция: " + func);
                          }
                      }
                  } else {
                      throw new RuntimeException("Ошибка в формуле");
                  }

                  if (eat('^')) x = Math.pow(x, parseFactor());

                  return x;
              }
          }
          EOF

          # 4. Графическое отображение функций (GraphView.java)
          cat << 'EOF' > app/src/main/java/com/example/functioncalculator/GraphView.java
          package com.example.functioncalculator;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.util.AttributeSet;
          import android.view.View;

          public class GraphView extends View {
              private String formula = "(1/4)x^3";
              private Paint axisPaint;
              private Paint gridPaint;
              private Paint linePaint;

              private float minX = -3f;
              private float maxX = 3f;
              private float minY = -10f;
              private float maxY = 10f;

              public GraphView(Context context) {
                  super(context);
                  init();
              }

              public GraphView(Context context, AttributeSet attrs) {
                  super(context, attrs);
                  init();
              }

              private void init() {
                  axisPaint = new Paint();
                  axisPaint.setColor(Color.DKGRAY);
                  axisPaint.setStrokeWidth(4f);

                  gridPaint = new Paint();
                  gridPaint.setColor(Color.LTGRAY);
                  gridPaint.setStrokeWidth(1f);

                  linePaint = new Paint();
                  linePaint.setColor(Color.RED);
                  linePaint.setStrokeWidth(5f);
                  linePaint.setStyle(Paint.Style.STROKE);
                  linePaint.setAntiAlias(true);
              }

              public void setFormulaAndRange(String formula, float minX, float maxX) {
                  this.formula = formula;
                  this.minX = minX;
                  this.maxX = maxX;
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  int w = getWidth();
                  int h = getHeight();

                  if (w == 0 || h == 0) return;

                  canvas.drawColor(Color.WHITE);

                  if (maxX <= minX) maxX = minX + 1;

                  float zeroX = w * (-minX) / (maxX - minX);
                  float zeroY = h * (maxY) / (maxY - minY);

                  // Сетка
                  float stepX = (maxX - minX) / 10f;
                  for (int i = 0; i <= 10; i++) {
                      float currentX = minX + i * stepX;
                      float gx = w * (currentX - minX) / (maxX - minX);
                      canvas.drawLine(gx, 0, gx, h, gridPaint);
                  }
                  for (int i = -10; i <= 10; i++) {
                      float gy = h * (maxY - i) / (maxY - minY);
                      canvas.drawLine(0, gy, w, gy, gridPaint);
                  }

                  // Оси X и Y
                  canvas.drawLine(0, zeroY, w, zeroY, axisPaint);
                  canvas.drawLine(zeroX, 0, zeroX, h, axisPaint);

                  if (formula == null || formula.trim().isEmpty()) return;

                  Path path = new Path();
                  boolean first = true;

                  for (int px = 0; px < w; px += 2) {
                      double x = minX + (double) px / w * (maxX - minX);
                      try {
                          MathFunctionParser parser = new MathFunctionParser(formula, x);
                          double y = parser.parse();

                          if (Double.isNaN(y) || Double.isInfinite(y)) {
                              first = true;
                              continue;
                          }

                          float py = (float) (h * (maxY - y) / (maxY - minY));

                          if (py < -h || py > 2 * h) {
                              first = true;
                              continue;
                          }

                          if (first) {
                              path.moveTo(px, py);
                              first = false;
                          } else {
                              path.lineTo(px, py);
                          }
                      } catch (Exception e) {
                          first = true;
                      }
                  }

                  canvas.drawPath(path, linePaint);
              }
          }
          EOF

          # 5. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/example/functioncalculator/MainActivity.java
          package com.example.functioncalculator;

          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private EditText inputFormula;
              private EditText inputStartX;
              private EditText inputEndX;
              private EditText inputStep;
              private Button btnCalc;
              private TextView textResult;
              private GraphView graphView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  inputFormula = findViewById(R.id.inputFormula);
                  inputStartX = findViewById(R.id.inputStartX);
                  inputEndX = findViewById(R.id.inputEndX);
                  inputStep = findViewById(R.id.inputStep);
                  btnCalc = findViewById(R.id.btnCalc);
                  textResult = findViewById(R.id.textResult);
                  graphView = findViewById(R.id.graphView);

                  btnCalc.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          calculate();
                      }
                  });
              }

              private void calculate() {
                  String formula = inputFormula.getText().toString().trim();
                  if (formula.isEmpty()) {
                      textResult.setText("Введите формулу");
                      return;
                  }

                  double startX = parseDoubleOrDefault(inputStartX.getText().toString(), -3.0);
                  double endX = parseDoubleOrDefault(inputEndX.getText().toString(), 3.0);
                  double step = parseDoubleOrDefault(inputStep.getText().toString(), 0.5);

                  if (startX >= endX) {
                      textResult.setText("Ошибка: Старт должен быть меньше Конца");
                      return;
                  }

                  if (step <= 0) {
                      step = 0.5;
                  }

                  graphView.setFormulaAndRange(formula, (float) startX, (float) endX);

                  StringBuilder sb = new StringBuilder();

                  for (double x = startX; x <= endX + 1e-9; x += step) {
                      try {
                          MathFunctionParser parser = new MathFunctionParser(formula, x);
                          double y = parser.parse();
                          sb.append(String.format("x = %.2f   -->   f(x) = %.4f\n", x, y));
                      } catch (Exception e) {
                          sb.append(String.format("x = %.2f   -->   Ошибка\n", x));
                      }
                  }
                  textResult.setText(sb.toString());
              }

              private double parseDoubleOrDefault(String val, double defaultValue) {
                  try {
                      return Double.parseDouble(val.trim());
                  } catch (Exception e) {
                      return defaultValue;
                  }
              }
          }
          EOF

          # 6. Разметка экрана с полями для диапазона и шага
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Формула f(x):"
                  android:textSize="18sp"
                  android:textStyle="bold" />

              <EditText
                  android:id="@+id/inputFormula"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="(1/4)x^3"
                  android:text="(1/4)x^3" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:layout_marginTop="8dp">

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical">
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Старт X"
                          android:textSize="12sp" />
                      <EditText
                          android:id="@+id/inputStartX"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:inputType="numberSigned|numberDecimal"
                          android:text="-3" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical"
                      android:layout_marginStart="8dp">
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Конец X"
                          android:textSize="12sp" />
                      <EditText
                          android:id="@+id/inputEndX"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:inputType="numberSigned|numberDecimal"
                          android:text="3" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical"
                      android:layout_marginStart="8dp">
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Шаг"
                          android:textSize="12sp" />
                      <EditText
                          android:id="@+id/inputStep"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:inputType="numberDecimal"
                          android:text="0.5" />
                  </LinearLayout>
              </LinearLayout>

              <Button
                  android:id="@+id/btnCalc"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Построить график и рассчитать" />

              <com.example.functioncalculator.GraphView
                  android:id="@+id/graphView"
                  android:layout_width="match_parent"
                  android:layout_height="220dp"
                  android:layout_marginTop="12dp" />

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_marginTop="12dp">

                  <TextView
                      android:id="@+id/textResult"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textSize="15sp"
                      android:typeface="monospace" />
              </ScrollView>
          </LinearLayout>
          EOF

          # 7. Конфигурация Gradle и Manifest
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyCalculator"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.1' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.functioncalculator'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.functioncalculator"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Калькулятор"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name="com.example.functioncalculator.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
