name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project Structure
        run: |
          # 1. Принимаем лицензии Android SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # 2. Создаем структуру каталогов
          mkdir -p app/src/main/java/com/example/functioncalculator
          mkdir -p app/src/main/res/layout

          # 3. Парсер математических выражений (MathFunctionParser.java)
          cat << 'EOF' > app/src/main/java/com/example/functioncalculator/MathFunctionParser.java
          package com.example.functioncalculator;

          public class MathFunctionParser {
              private final String str;
              private final double xVal;
              private int pos = -1;
              private int ch;

              public MathFunctionParser(String str, double xVal) {
                  this.str = str;
                  this.xVal = xVal;
              }

              private void nextChar() {
                  ch = (++pos < str.length()) ? str.charAt(pos) : -1;
              }

              private boolean eat(int charToEat) {
                  while (ch == ' ') nextChar();
                  if (ch == charToEat) {
                      nextChar();
                      return true;
                  }
                  return false;
              }

              public double parse() {
                  nextChar();
                  double x = parseExpression();
                  if (pos < str.length()) throw new RuntimeException("Неизвестный символ: " + (char)ch);
                  return x;
              }

              private double parseExpression() {
                  double x = parseTerm();
                  for (;;) {
                      if      (eat('+')) x += parseTerm();
                      else if (eat('-')) x -= parseTerm();
                      else return x;
                  }
              }

              private double parseTerm() {
                  double x = parseFactor();
                  for (;;) {
                      if      (eat('*')) x *= parseFactor();
                      else if (eat('/')) x /= parseFactor();
                      else if (ch == '(' || (ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) {
                          x *= parseFactor();
                      }
                      else return x;
                  }
              }

              private double parseFactor() {
                  if (eat('+')) return +parseFactor();
                  if (eat('-')) return -parseFactor();

                  double x;
                  int startPos = this.pos;
                  if (eat('(')) {
                      x = parseExpression();
                      eat(')');
                  } else if ((ch >= '0' && ch <= '9') || ch == '.') {
                      while ((ch >= '0' && ch <= '9') || ch == '.') nextChar();
                      x = Double.parseDouble(str.substring(startPos, this.pos));
                  } else if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) {
                      while ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) nextChar();
                      String func = str.substring(startPos, this.pos);
                      if (func.equalsIgnoreCase("x")) {
                          x = xVal;
                      } else {
                          if (eat('(')) {
                              x = parseExpression();
                              eat(')');
                          } else {
                              x = parseFactor();
                          }
                          switch (func.toLowerCase()) {
                              case "sin": x = Math.sin(x); break;
                              case "cos": x = Math.cos(x); break;
                              case "tan": x = Math.tan(x); break;
                              case "sqrt": x = Math.sqrt(x); break;
                              case "abs": x = Math.abs(x); break;
                              case "log": case "ln": x = Math.log(x); break;
                              default: throw new RuntimeException("Неизвестная функция: " + func);
                          }
                      }
                  } else {
                      throw new RuntimeException("Ошибка в формуле");
                  }

                  if (eat('^')) x = Math.pow(x, parseFactor());

                  return x;
              }
          }
          EOF

          # 4. Компонент отрисовки графика (GraphView.java)
          cat << 'EOF' > app/src/main/java/com/example/functioncalculator/GraphView.java
          package com.example.functioncalculator;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.util.AttributeSet;
          import android.view.View;

          public class GraphView extends View {
              private String formula = "(1/4)x^3";
              private Paint axisPaint;
              private Paint gridPaint;
              private Paint linePaint;

              private float minX = -3f;
              private float maxX = 3f;
              private float minY = -10f;
              private float maxY = 10f;

              public GraphView(Context context) {
                  super(context);
                  init();
              }

              public GraphView(Context context, AttributeSet attrs) {
                  super(context, attrs);
                  init();
              }

              private void init() {
                  axisPaint = new Paint();
                  axisPaint.setColor(Color.parseColor("#334155"));
                  axisPaint.setStrokeWidth(4f);
                  axisPaint.setAntiAlias(true);

                  gridPaint = new Paint();
                  gridPaint.setColor(Color.parseColor("#E2E8F0"));
                  gridPaint.setStrokeWidth(2f);

                  linePaint = new Paint();
                  linePaint.setColor(Color.parseColor("#4F46E5"));
                  linePaint.setStrokeWidth(6f);
                  linePaint.setStyle(Paint.Style.STROKE);
                  linePaint.setAntiAlias(true);
              }

              public void setFormulaAndRange(String formula, float minX, float maxX) {
                  this.formula = formula;
                  this.minX = minX;
                  this.maxX = maxX;
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  int w = getWidth();
                  int h = getHeight();

                  if (w == 0 || h == 0) return;

                  canvas.drawColor(Color.WHITE);

                  if (maxX <= minX) maxX = minX + 1;

                  float zeroX = w * (-minX) / (maxX - minX);
                  float zeroY = h * (maxY) / (maxY - minY);

                  // Сетка
                  float stepX = (maxX - minX) / 10f;
                  for (int i = 0; i <= 10; i++) {
                      float currentX = minX + i * stepX;
                      float gx = w * (currentX - minX) / (maxX - minX);
                      canvas.drawLine(gx, 0, gx, h, gridPaint);
                  }
                  for (int i = -10; i <= 10; i++) {
                      float gy = h * (maxY - i) / (maxY - minY);
                      canvas.drawLine(0, gy, w, gy, gridPaint);
                  }

                  // Оси X и Y
                  canvas.drawLine(0, zeroY, w, zeroY, axisPaint);
                  canvas.drawLine(zeroX, 0, zeroX, h, axisPaint);

                  if (formula == null || formula.trim().isEmpty()) return;

                  Path path = new Path();
                  boolean first = true;

                  for (int px = 0; px < w; px += 2) {
                      double x = minX + (double) px / w * (maxX - minX);
                      try {
                          MathFunctionParser parser = new MathFunctionParser(formula, x);
                          double y = parser.parse();

                          if (Double.isNaN(y) || Double.isInfinite(y)) {
                              first = true;
                              continue;
                          }

                          float py = (float) (h * (maxY - y) / (maxY - minY));

                          if (py < -h || py > 2 * h) {
                              first = true;
                              continue;
                          }

                          if (first) {
                              path.moveTo(px, py);
                              first = false;
                          } else {
                              path.lineTo(px, py);
                          }
                      } catch (Exception e) {
                          first = true;
                      }
                  }

                  canvas.drawPath(path, linePaint);
              }
          }
          EOF

          # 5. MainActivity.java с поддержкой своей виртуальной клавиатуры
          cat << 'EOF' > app/src/main/java/com/example/functioncalculator/MainActivity.java
          package com.example.functioncalculator;

          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private EditText inputFormula;
              private EditText inputStartX;
              private EditText inputEndX;
              private EditText inputStep;
              private Button btnCalc;
              private TextView textResult;
              private GraphView graphView;

              private EditText activeInput;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  inputFormula = findViewById(R.id.inputFormula);
                  inputStartX = findViewById(R.id.inputStartX);
                  inputEndX = findViewById(R.id.inputEndX);
                  inputStep = findViewById(R.id.inputStep);
                  btnCalc = findViewById(R.id.btnCalc);
                  textResult = findViewById(R.id.textResult);
                  graphView = findViewById(R.id.graphView);

                  // Отключаем системную клавиатуру для всех полей ввода
                  disableSoftKeyboard(inputFormula);
                  disableSoftKeyboard(inputStartX);
                  disableSoftKeyboard(inputEndX);
                  disableSoftKeyboard(inputStep);

                  activeInput = inputFormula;

                  View.OnFocusChangeListener focusListener = new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean hasFocus) {
                          if (hasFocus && v instanceof EditText) {
                              activeInput = (EditText) v;
                          }
                      }
                  };

                  inputFormula.setOnFocusChangeListener(focusListener);
                  inputStartX.setOnFocusChangeListener(focusListener);
                  inputEndX.setOnFocusChangeListener(focusListener);
                  inputStep.setOnFocusChangeListener(focusListener);

                  setupKeypad();

                  btnCalc.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          calculate();
                      }
                  });
              }

              private void disableSoftKeyboard(EditText editText) {
                  editText.setShowSoftInputOnFocus(false);
              }

              private void setupKeypad() {
                  int[] keyIds = new int[] {
                      R.id.btn0, R.id.btn1, R.id.btn2, R.id.btn3, R.id.btn4,
                      R.id.btn5, R.id.btn6, R.id.btn7, R.id.btn8, R.id.btn9,
                      R.id.btnDot, R.id.btnPlus, R.id.btnMinus, R.id.btnMultiply,
                      R.id.btnDivide, R.id.btnPower, R.id.btnOpenParen, R.id.btnCloseParen,
                      R.id.btnX, R.id.btnSin, R.id.btnCos, R.id.btnSqrt, R.id.btnFraction
                  };

                  View.OnClickListener keyListener = new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Button b = (Button) v;
                          String text = b.getText().toString();
                          if (text.equals("a/b")) {
                              insertText("(/)");
                          } else if (text.equals("√")) {
                              insertText("sqrt(");
                          } else if (text.equals("sin") || text.equals("cos")) {
                              insertText(text + "(");
                          } else {
                              insertText(text);
                          }
                      }
                  };

                  for (int id : keyIds) {
                      View v = findViewById(id);
                      if (v != null) {
                          v.setOnClickListener(keyListener);
                      }
                  }

                  View btnBackspace = findViewById(R.id.btnBackspace);
                  if (btnBackspace != null) {
                      btnBackspace.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              deleteChar();
                          }
                      });
                  }

                  View btnClear = findViewById(R.id.btnClear);
                  if (btnClear != null) {
                      btnClear.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              if (activeInput != null) {
                                  activeInput.setText("");
                              }
                          }
                      });
                  }
              }

              private void insertText(String text) {
                  if (activeInput == null) return;
                  int start = Math.max(activeInput.getSelectionStart(), 0);
                  int end = Math.max(activeInput.getSelectionEnd(), 0);
                  activeInput.getText().replace(Math.min(start, end), Math.max(start, end),
                          text, 0, text.length());
              }

              private void deleteChar() {
                  if (activeInput == null) return;
                  int start = activeInput.getSelectionStart();
                  int end = activeInput.getSelectionEnd();
                  if (start != end) {
                      activeInput.getText().delete(start, end);
                  } else if (start > 0) {
                      activeInput.getText().delete(start - 1, start);
                  }
              }

              private void calculate() {
                  String formula = inputFormula.getText().toString().trim();
                  if (formula.isEmpty()) {
                      textResult.setText("Введите формулу");
                      return;
                  }

                  double startX = parseDoubleOrDefault(inputStartX.getText().toString(), -3.0);
                  double endX = parseDoubleOrDefault(inputEndX.getText().toString(), 3.0);
                  double step = parseDoubleOrDefault(inputStep.getText().toString(), 0.5);

                  if (startX >= endX) {
                      textResult.setText("Ошибка: Старт должен быть меньше Конца");
                      return;
                  }

                  if (step <= 0) {
                      step = 0.5;
                  }

                  graphView.setFormulaAndRange(formula, (float) startX, (float) endX);

                  StringBuilder sb = new StringBuilder();

                  for (double x = startX; x <= endX + 1e-9; x += step) {
                      try {
                          MathFunctionParser parser = new MathFunctionParser(formula, x);
                          double y = parser.parse();
                          sb.append(String.format("x = %6.2f   -->   f(x) = %8.4f\n", x, y));
                      } catch (Exception e) {
                          sb.append(String.format("x = %6.2f   -->   Ошибка\n", x));
                      }
                  }
                  textResult.setText(sb.toString());
              }

              private double parseDoubleOrDefault(String val, double defaultValue) {
                  try {
                      return Double.parseDouble(val.trim());
                  } catch (Exception e) {
                      return defaultValue;
                  }
              }
          }
          EOF

          # 6. Разметка экрана с кнопками клавиатуры (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F8FAFC"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="12dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Colku"
                      android:textColor="#1E293B"
                      android:textSize="24sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="8dp" />

                  <!-- Поля ввода -->
                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginBottom="10dp"
                      app:cardCornerRadius="12dp"
                      app:cardElevation="2dp"
                      app:cardBackgroundColor="#FFFFFF">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="12dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Формула f(x)"
                              android:textColor="#64748B"
                              android:textSize="12sp"
                              android:textStyle="bold" />

                          <EditText
                              android:id="@+id/inputFormula"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="(1/4)x^3"
                              android:text="(1/4)x^3"
                              android:textColor="#0F172A"
                              android:textSize="16sp" />

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:layout_marginTop="8dp">

                              <LinearLayout
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:orientation="vertical">
                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Старт X"
                                      android:textColor="#64748B"
                                      android:textSize="11sp" />
                                  <EditText
                                      android:id="@+id/inputStartX"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:text="-3"
                                      android:textColor="#0F172A" />
                              </LinearLayout>

                              <LinearLayout
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:orientation="vertical"
                                  android:layout_marginStart="6dp">
                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Конец X"
                                      android:textColor="#64748B"
                                      android:textSize="11sp" />
                                  <EditText
                                      android:id="@+id/inputEndX"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:text="3"
                                      android:textColor="#0F172A" />
                              </LinearLayout>

                              <LinearLayout
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:orientation="vertical"
                                  android:layout_marginStart="6dp">
                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Шаг"
                                      android:textColor="#64748B"
                                      android:textSize="11sp" />
                                  <EditText
                                      android:id="@+id/inputStep"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:text="0.5"
                                      android:textColor="#0F172A" />
                              </LinearLayout>
                          </LinearLayout>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- Встроенная клавиатура -->
                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginBottom="10dp"
                      app:cardCornerRadius="12dp"
                      app:cardElevation="2dp"
                      app:cardBackgroundColor="#FFFFFF">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="8dp">

                          <!-- Ряд 1 -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal">
                              <Button android:id="@+id/btnX" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="x" android:textAllCaps="false" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnPower" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="^" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnFraction" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="a/b" android:textAllCaps="false" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnOpenParen" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="(" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnCloseParen" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text=")" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnBackspace" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="⌫" style="?attr/materialButtonOutlinedStyle" />
                          </LinearLayout>

                          <!-- Ряд 2 -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal">
                              <Button android:id="@+id/btnSin" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="sin" android:textAllCaps="false" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnCos" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="cos" android:textAllCaps="false" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnSqrt" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="√" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnDivide" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="/" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnMultiply" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="*" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnClear" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="C" style="?attr/materialButtonOutlinedStyle" />
                          </LinearLayout>

                          <!-- Ряд 3 -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal">
                              <Button android:id="@+id/btn7" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="7" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btn8" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="8" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btn9" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="9" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnMinus" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="-" style="?attr/materialButtonOutlinedStyle" />
                          </LinearLayout>

                          <!-- Ряд 4 -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal">
                              <Button android:id="@+id/btn4" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="4" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btn5" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="5" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btn6" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="6" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnPlus" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="+" style="?attr/materialButtonOutlinedStyle" />
                          </LinearLayout>

                          <!-- Ряд 5 -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal">
                              <Button android:id="@+id/btn1" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="1" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btn2" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="2" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btn3" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="3" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btn0" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="0" style="?attr/materialButtonOutlinedStyle" />
                              <Button android:id="@+id/btnDot" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="." style="?attr/materialButtonOutlinedStyle" />
                          </LinearLayout>

                          <Button
                              android:id="@+id/btnCalc"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="8dp"
                              android:backgroundTint="#4F46E5"
                              android:text="Рассчитать и построить"
                              android:textAllCaps="false"
                              android:textColor="#FFFFFF"
                              android:textSize="15sp"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- Карточка графика -->
                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginBottom="10dp"
                      app:cardCornerRadius="12dp"
                      app:cardElevation="2dp"
                      app:cardBackgroundColor="#FFFFFF">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="12dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="График функции"
                              android:textColor="#64748B"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:layout_marginBottom="6dp" />

                          <com.example.functioncalculator.GraphView
                              android:id="@+id/graphView"
                              android:layout_width="match_parent"
                              android:layout_height="200dp" />
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- Таблица результатов -->
                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardCornerRadius="12dp"
                      app:cardElevation="2dp"
                      app:cardBackgroundColor="#FFFFFF">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="12dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Таблица значений"
                              android:textColor="#64748B"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:layout_marginBottom="6dp" />

                          <TextView
                              android:id="@+id/textResult"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#334155"
                              android:textSize="14sp"
                              android:typeface="monospace" />
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

              </LinearLayout>
          </ScrollView>
          EOF

          # 7. Конфигурация Gradle и Manifest
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Colku"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.1' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.functioncalculator'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.functioncalculator"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Colku"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name="com.example.functioncalculator.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          gradle assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Colku.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colku-APK
          path: app/build/outputs/apk/debug/Colku.apk
