          android {
              namespace 'com.example.functioncalculator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.functioncalculator"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
